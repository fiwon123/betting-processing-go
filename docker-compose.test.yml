services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: ${KC_DB:-keycloak_test}
      POSTGRES_USER: ${KC_DB_USER:-keycloak_test}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak_test}
      API_DB: ${API_DB:-api_test}
      API_DB_USER: ${API_DB_USER:-api_test}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api_test}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak_test} -d ${KC_DB:-keycloak_test}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  migrate:
    image: migrate/migrate:4
    environment:
      API_DB: ${API_DB:-api_test}
      API_DB_HOST: postgres
      API_DB_PORT: "5432"
      API_DB_USER: ${API_DB_USER:-api_test}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api_test}
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrations/run-migrate.sh:/scripts/run-migrate.sh:ro
    entrypoint: ["/scripts/run-migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KC_DB:-keycloak_test}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak_test}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak_test}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: "http://localhost:8081"
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ministack:
    image: ministackorg/ministack:1.5.10
    ports:
      - "4566:4566"
    environment:
      AWS_REGION: us-east-1

  sqs-init:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/sqs-init"]
    restart: "no"
    environment:
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: wager-transactions.fifo
      SQS_OUTBOUND_QUEUE_NAME: wager-events-outbound.fifo
    depends_on:
      ministack:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_ENVIRONMENT: development
      API_DB_HOST: postgres
      API_DB_PORT: "5432"
      API_DB: ${API_DB:-api_test}
      API_DB_USER: ${API_DB_USER:-api_test}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api_test}
      API_DB_SSLMODE: disable
      API_DB_MIN_CONNS: "2"
      API_DB_MAX_CONNS: "10"
      API_DB_MAX_CONN_LIFETIME: 30m
      API_DB_MAX_CONN_IDLE_TIME: 5m
      API_OIDC_ENABLED: "true"
      API_OIDC_ISSUER_URL: http://keycloak:8080/realms/betting
      API_OIDC_CLIENT_ID: betting-api
      API_OIDC_JWKS_URL: http://keycloak:8080/realms/betting/protocol/openid-connect/certs
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: wager-transactions.fifo
      SQS_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      ministack:
        condition: service_started
      sqs-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/worker"]
    environment:
      API_ENVIRONMENT: development
      API_DB_HOST: postgres
      API_DB_PORT: "5432"
      API_DB: ${API_DB:-api_test}
      API_DB_USER: ${API_DB_USER:-api_test}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api_test}
      API_DB_SSLMODE: disable
      API_DB_MIN_CONNS: "2"
      API_DB_MAX_CONNS: "10"
      API_DB_MAX_CONN_LIFETIME: 30m
      API_DB_MAX_CONN_IDLE_TIME: 5m
      API_OIDC_ENABLED: "true"
      API_OIDC_ISSUER_URL: http://keycloak:8080/realms/betting
      API_OIDC_CLIENT_ID: betting-api
      API_OIDC_JWKS_URL: http://keycloak:8080/realms/betting/protocol/openid-connect/certs
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_NAME: wager-transactions.fifo
      SQS_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
      SQS_OUTBOUND_QUEUE_URL: http://ministack:4566/000000000000/wager-events-outbound.fifo
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ministack:
        condition: service_started
      sqs-init:
        condition: service_completed_successfully

  keycloak-setup:
    image: curlimages/curl:latest
    depends_on:
      keycloak:
        condition: service_started
    volumes:
      - ./scripts/keycloak:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-test-realm.sh"]
    environment:
      KC_URL: http://keycloak:8080
      KC_ADMIN_USERNAME: admin
      KC_ADMIN_PASSWORD: admin
      KC_DB_HOST: postgres
      KC_DB_USER: keycloak_test
      KC_DB_PASSWORD: keycloak_test
      KC_DB: keycloak_test
    restart: "no"

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://api_test:api_test@postgres:5432/api_test?sslmode=disable
      API_BASE_URL: http://api:8080
      KC_URL: http://keycloak:8080
      KC_REALM: betting
      KC_CLIENT_ID: betting-api
      KC_CLIENT_SECRET: secret123
      KC_USERNAME_PROVIDER1: provider1
      KC_PASSWORD_PROVIDER1: provider1
      KC_USERNAME_PROVIDER2: provider2
      KC_PASSWORD_PROVIDER2: provider2
      SQS_QUEUE_URL: http://ministack:4566/000000000000/wager-transactions.fifo
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
      keycloak-setup:
        condition: service_completed_successfully
    volumes:
      - ./test-results:/app/test-results

volumes:
  postgres_test_data:
