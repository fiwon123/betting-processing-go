services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_DB: ${KC_DB}
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}

      API_ENVIRONMENT: ${API_ENVIRONMENT}
      API_DB: ${API_DB}
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KC_DB_USER} -d ${KC_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:4
    environment:
      API_DB: ${API_DB}
      API_DB_HOST: ${API_DB_HOST}
      API_DB_PORT: ${API_DB_PORT}
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrations/run-migrate.sh:/scripts/run-migrate.sh:ro
    entrypoint: ["/scripts/run-migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KC_DB}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: "http://localhost:8081"
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak-init:
    image: alpine:3.20
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"
    environment:
      KC_URL: http://keycloak:8080
      KC_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./scripts/keycloak/setup-test-realm.sh:/scripts/setup-test-realm.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null 2>&1 && /bin/sh /scripts/setup-test-realm.sh"]

  sqs-init:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/sqs-init"]
    restart: "no"
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME}
      SQS_OUTBOUND_QUEUE_NAME: ${SQS_OUTBOUND_QUEUE_NAME:-wager-events-outbound.fifo}
    depends_on:
      ministack:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_ENVIRONMENT: ${API_ENVIRONMENT}

      API_DB_HOST: ${API_DB_HOST}
      API_DB_PORT: ${API_DB_PORT}
      API_DB: ${API_DB}
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      API_DB_SSLMODE: ${API_DB_SSLMODE}

      API_DB_MIN_CONNS: ${API_DB_MIN_CONNS}
      API_DB_MAX_CONNS: ${API_DB_MAX_CONNS}
      API_DB_MAX_CONN_LIFETIME: ${API_DB_MAX_CONN_LIFETIME}
      API_DB_MAX_CONN_IDLE_TIME: ${API_DB_MAX_CONN_IDLE_TIME}

      API_OIDC_ENABLED: ${API_OIDC_ENABLED}
      API_OIDC_ISSUER_URL: ${API_OIDC_ISSUER_URL}
      API_OIDC_CLIENT_ID: ${API_OIDC_CLIENT_ID}
      API_OIDC_JWKS_URL: ${API_OIDC_JWKS_URL}

      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
      ministack:
        condition: service_started
      sqs-init:
        condition: service_completed_successfully

  ministack:
    image: ministackorg/ministack:1.5.10
    ports:
      - "4566:4566"
    environment:
      AWS_REGION: ${AWS_REGION}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/worker"]
    environment:
      API_ENVIRONMENT: ${API_ENVIRONMENT}

      API_DB_HOST: ${API_DB_HOST}
      API_DB_PORT: ${API_DB_PORT}
      API_DB: ${API_DB}
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      API_DB_SSLMODE: ${API_DB_SSLMODE}

      API_DB_MIN_CONNS: ${API_DB_MIN_CONNS}
      API_DB_MAX_CONNS: ${API_DB_MAX_CONNS}
      API_DB_MAX_CONN_LIFETIME: ${API_DB_MAX_CONN_LIFETIME}
      API_DB_MAX_CONN_IDLE_TIME: ${API_DB_MAX_CONN_IDLE_TIME}

      API_OIDC_ENABLED: ${API_OIDC_ENABLED}
      API_OIDC_ISSUER_URL: ${API_OIDC_ISSUER_URL}
      API_OIDC_CLIENT_ID: ${API_OIDC_CLIENT_ID}
      API_OIDC_JWKS_URL: ${API_OIDC_JWKS_URL}

      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      SQS_OUTBOUND_QUEUE_URL: ${SQS_OUTBOUND_QUEUE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ministack:
        condition: service_started
      sqs-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
